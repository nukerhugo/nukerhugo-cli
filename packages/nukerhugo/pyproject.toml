[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nukerhugo"
version = "0.1.0"
description = "Nukerhugo CLI - sign in to Nukerhugo AI and run Nukerhugo tools (standard library only)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license-files = ["LICENSE"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.optional-dependencies]
code = ["nukerhugo-code"]

[project.scripts]
nukerhugo = "nukerhugo.cli:main"

[tool.setuptools]
packages = ["nukerhugo"]
