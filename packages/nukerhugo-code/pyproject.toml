[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nukerhugo-code"
version = "0.1.0"
description = "Nukerhugo Code - a terminal coding agent (standard library only)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["nukerhugo>=0.1.0"]
license-files = ["LICENSE"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
nukerhugo-code = "nukerhugo_code.cli:main"

[tool.setuptools]
packages = ["nukerhugo_code"]
